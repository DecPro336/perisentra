name: perisentra
version: "1.0.0"
config-version: 2
profile: perisentra

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
clean-targets: ["target", "dbt_packages", "logs"]

vars:
  future_horizon_days: 14

models:
  perisentra:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

tests:
  perisentra:
    +severity: error
