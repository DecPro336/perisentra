# Commercial constraints applied by the decision engine.
# The engine reads this file (or the latest saved version from the dashboard) at decision time,
# so rules change without retraining any model.

version: 1
objective:
  # Pick the action with the lowest expected waste value; among actions whose expected waste is within
  # max(tie_tolerance_pct of the best one, min_waste_gain) of it, keep the highest expected margin. This
  # stops the engine from discounting units that would have sold anyway.
  primary: min_expected_waste_value
  tie_tolerance_pct: 6
  min_waste_gain: 0.40          # ignore markdowns that save less than this in expected waste value
  markdown_must_pay_for_itself: true  # stock is already bought: a markdown must raise expected revenue
  min_revenue_gain: 0.0

markdown:
  ladder_pct: [10, 20, 30, 40, 50]
  max_days_before_expiry: 3          # a markdown can only start in the last N days of shelf life
  max_discount_pct:
    default: 50
    Cheese: 30
    Dairy: 40
    Deli Meats: 40
  price_endings: [0.99, 0.79, 0.49, 0.29]  # discounted prices snap to the nearest of these endings
  min_price: 0.29                    # USD

margin:
  # Unit floor: discounted price >= unit cost x (1 + floor). Negative floors allow clearance below cost.
  unit_floor_pct:
    default: -25
    Bakery: -60
    Pastries & Desserts: -50
    Cheese: 0
  # Window floor: expected gross margin rate of the SKU over the markdown window.
  window_floor_pct:
    default: 8
    Bakery: 0
    Pastries & Desserts: 0

promotions:
  lock_markdowns_during_promo: true

replenishment:
  enabled: true
  min_change_units: 3
  min_change_pct: 30
  max_change_pct: 60
  service_level_bounds: [0.80, 0.97]

donation:
  enabled: true
  min_units: 3
  tax_benefit_pct: 50                # approx. share of cost recovered via the enhanced food-inventory deduction (IRC 170(e)(3))

exploration:
  # Randomise between near-equivalent actions on a small share of decisions and log the propensity,
  # so future elasticity refits learn from unconfounded price variation.
  rate: 0.08

legacy:                              # today's store rule (flat "manager's special"), the reference for every decision
  markdown_pct: 30
  days_before_expiry: 2

confidence:
  high_min_score: 0.70
  medium_min_score: 0.45
