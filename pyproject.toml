[project]
name = "perisentra"
version = "1.0.0"
description = "Predictive decision engine for fresh retail: demand forecasting, stock-at-risk detection and constraint-aware commercial actions."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=3.0",
    "polars>=1.8",
    "pyarrow>=17",
    "duckdb>=1.1",
    "dbt-core>=1.9",
    "dbt-duckdb>=1.9",
    "lightgbm>=4.5",
    "scikit-learn>=1.5",
    "pymc>=6.0",
    "arviz>=0.20",
    "nutpie>=0.13",
    "mlflow>=2.17",
    "evidently>=0.6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "holidays>=0.60",
    "typer>=0.12",
    "rich>=13.9",
    "sqlalchemy>=2.0",
    "scipy>=1.14",
]

[project.optional-dependencies]
# Snowflake warehouse target (PERISENTRA_DBT_TARGET=snowflake): dbt adapter + Python connector
snowflake = [
    "dbt-snowflake>=1.9",
    "snowflake-connector-python>=3.12",
]

[project.scripts]
perisentra = "perisentra.cli:app"

# The repository also holds the simulated retailer (simulator/): a separate package with its own dependencies.
# Perisentra never imports it; the two only exchange files through exchange/.
[tool.uv.workspace]
members = ["simulator"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/perisentra"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# Run and log timestamps are local wall-clock times of the machine running the pipeline (America/New_York in
# deployment), stored without an offset to match existing rows in the app DB.
ignore = ["DTZ001", "DTZ005", "DTZ011"]

[tool.pytest.ini_options]
testpaths = ["tests", "simulator/tests"]
addopts = "-q"
