# Fernbrook Market: the retailer's world and source systems, simulated.
# Every store, product and sale is fictional; weather and US public holidays are real (Open-Meteo, Nager.Date),
# so demand reacts to real-world conditions. Perisentra never reads this file: it only sees the extracts the
# simulator delivers to the exchange folder, like it would see a real retailer's ERP, POS and WMS exports.

seed: 20260706
chain_name: "Fernbrook Market"
country: US

calendar:
  warmup_days: 35            # simulated but not exported (fills shelves, AR state, store-rule forecasts)
  start_date: 2024-09-02     # first day of exported history
  catalog_reference_date: 2026-10-01      # recent product launches are placed relative to this date
  sequential_promotions_until: 2026-10-22  # promotions up to here were drawn as one sequence when the history
                                           # was generated; later weeks use one random stream per week
  closed_holidays: ["12-25"]                 # fixed dates (MM-DD) when every store is closed
  closed_holiday_names: ["Thanksgiving Day"]  # moving holidays (Nager.Date names) when stores are closed

price_test:                   # the randomized discount test the chain ran in spring 2026 (3 stores, 6 weeks)
  n_stores: 3
  start: 2026-03-02
  end: 2026-04-12
  share_of_sku_days: 0.35
  discount_levels: [10, 20, 30, 40]

stores_behaviour:
  task_compliance: 0.9        # share of the daily task-list items (Perisentra's recommendations) stores carry out

legacy_policy:                 # what stores do without a task list: their current rule
  markdown_pct: 30             # flat "manager's special" discount ...
  trigger_days_to_expiry: 1    # ... when units are sold by today or tomorrow
  forecast_window_days: 14
  safety_factor: {short: 0.12, medium: 0.16, long: 0.25}   # by shelf life <=2, <=6, >6 days

world:
  n_skus: 220
  ar_phi: 0.75
  ar_sigma: 0.09
  store_shock_sigma: 0.06
  shortship_prob: 0.04
  unrecorded_shrink_rate: 0.0015
  damage_rate: 0.0012
  waste_log_miss_rate: 0.03
  footfall_outage_rate: 0.015
  pos_duplicate_rate: 0.003
  inflation_step: {date: 2025-03-01, pct: 2.5}
  weather:                     # thresholds for the hidden weather effect (imperial units)
    temp_base_f: 64
    hot_threshold_f: 77
    rain_threshold_in: 0.2
  competitor_openings:         # step changes in footfall that the model must pick up
    - {store_id: 9, date: 2026-02-02, effect: -0.12}
    - {store_id: 16, date: 2025-11-03, effect: -0.08}

formats:
  supercenter:  {assortment: 1.00, volume: 1.70, sunday: 1.0, footfall: 6000, surface_sqft: 90000}
  supermarket:  {assortment: 0.85, volume: 1.00, sunday: 1.0, footfall: 2800, surface_sqft: 45000}
  neighborhood: {assortment: 0.55, volume: 0.50, sunday: 1.0, footfall: 1300, surface_sqft: 12000}

# summer: demand shift from June to August (college towns empty out, lake towns fill up)
