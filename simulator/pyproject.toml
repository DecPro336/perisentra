[project]
name = "fernbrook-sim"
version = "1.0.0"
description = "Fernbrook Market source systems, simulated: a lot-level fresh-retail world that delivers daily ERP, POS and WMS extracts."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=3.0",
    "pyarrow>=17",
    "scipy>=1.14",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "holidays>=0.60",
    "typer>=0.12",
]

[project.scripts]
fernbrook = "fernbrook.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fernbrook"]
